# Optional local MySQL only — host port 3307 so XAMPP can keep 3306.
# Not used by default for npm run dev (use XAMPP / existing backend/.env).
#
#   docker compose -f docker-compose.local-mysql.yml up -d
#   # then temporarily point backend/.env: DB_PORT=3307 (empty root password)
#
# Production full stack remains: docker-compose.yml (MySQL not published on host).

services:
  mysql:
    image: mysql:8.4
    container_name: fos-erp-mysql
    restart: "no"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: fos_erp
    ports:
      - "3307:3306"
    volumes:
      - fos_erp_mysql_local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  fos_erp_mysql_local:
